<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Chromebook → Twitch</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1b1f24;
    --border: #2a2f36;
    --text: #e8eaed;
    --muted: #8b94a0;
    --live: #e6402b;
    --standby: #e8b339;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app { width: 100%; max-width: 420px; }

  header { margin-bottom: 20px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .preview-frame {
    position: relative;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px 6px 0 0;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .preview-frame video { width: 100%; height: 100%; object-fit: contain; }
  .preview-frame .empty { color: var(--muted); font-size: 13px; }

  .tally {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 6px 6px;
    font-size: 13px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.standby { background: var(--standby); }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px rgba(230, 64, 43, 0.2); }
  .dot.error { background: var(--live); }
  .tally .status-text { flex: 1; }
  .tally .timer { font-family: var(--mono); color: var(--muted); }

  .panel {
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    background: var(--panel);
  }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

  input[type="password"] {
    width: 100%;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: var(--mono);
  }
  input[type="password"]:focus { outline: 2px solid var(--standby); outline-offset: 1px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; }
  .checkbox-row label { margin: 0; color: var(--text); font-size: 14px; }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #262b32;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    font-family: var(--sans);
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover:not(:disabled) { background: #2f353d; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--standby); color: #1a1400; border-color: var(--standby); }
  button.primary:hover:not(:disabled) { background: #f0bd4a; }
  button.stop { background: transparent; color: var(--live); border-color: var(--live); }

  footer { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .dot.live { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chromebook → Twitch</h1>
    <p>Screen capture straight to your channel. No app, no watermark.</p>
  </header>

  <div class="preview-frame">
    <video id="preview" autoplay muted playsinline></video>
    <span class="empty" id="previewEmpty">Nothing shared yet</span>
  </div>
  <div class="tally">
    <span class="dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Idle</span>
    <span class="timer" id="timer">00:00:00</span>
  </div>

  <div class="panel">
    <label for="streamKey">Twitch stream key</label>
    <input type="password" id="streamKey" placeholder="live_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">

    <div class="checkbox-row">
      <input type="checkbox" id="micToggle">
      <label for="micToggle">Include microphone</label>
    </div>

    <button id="shareBtn">1. Share screen</button>
    <button id="goLiveBtn" class="primary" disabled>2. Go live</button>
    <button id="stopBtn" class="stop" disabled>Stop</button>
  </div>

  <footer>
    Your stream key only talks to Twitch directly from this page. It's never saved or sent anywhere else.
    Get your key from the <a href="https://dashboard.twitch.tv/settings/stream" target="_blank" rel="noopener">Twitch dashboard</a> under Settings → Stream.
  </footer>
</div>

<script>
/*
 * How this works, in short:
 * 1. getDisplayMedia() asks Chrome for a screen/window/tab capture — this is the
 *    same picker OS-level recorders use, no extension required.
 * 2. We hand the video track (and mixed audio) to an RTCPeerConnection and send
 *    Twitch a WHIP request: a single HTTP POST containing our WebRTC "offer".
 *    WHIP (WebRTC-HTTP Ingestion Protocol) is the open standard OBS also uses
 *    for its WHIP output — we're just doing by hand what OBS does under the hood.
 * 3. Twitch replies with an "answer" and the connection goes straight from this
 *    tab to Twitch's ingest server. No middle server, no branding, no watermark,
 *    because there's no third-party app in the loop at all.
 *
 * Note: Twitch's WHIP endpoint is a real but unofficial/beta feature (used by
 * OBS's own WHIP output) rather than a documented, guaranteed API, so treat it
 * as "works today" rather than "contractually stable." See the README.
 */

const WHIP_ENDPOINT = 'https://g.webrtc.live-video.net:4443/v2/offer';

const els = {
  streamKey: document.getElementById('streamKey'),
  micToggle: document.getElementById('micToggle'),
  shareBtn: document.getElementById('shareBtn'),
  goLiveBtn: document.getElementById('goLiveBtn'),
  stopBtn: document.getElementById('stopBtn'),
  preview: document.getElementById('preview'),
  previewEmpty: document.getElementById('previewEmpty'),
  statusDot: document.getElementById('statusDot'),
  statusText: document.getElementById('statusText'),
  timer: document.getElementById('timer'),
};

let pc = null;
let whipResourceUrl = null;
let displayStream = null;
let micStream = null;
let startTime = null;
let timerInterval = null;

function setStatus(state, text) {
  els.statusDot.className = 'dot ' + state;
  els.statusText.textContent = text;
}

function updateTimer() {
  const s = Math.floor((Date.now() - startTime) / 1000);
  const hh = String(Math.floor(s / 3600)).padStart(2, '0');
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  els.timer.textContent = `${hh}:${mm}:${ss}`;
}

// Mixes any number of audio tracks (mic + tab/system audio) into one track,
// so "include microphone" layers on top of whatever the screen share captured.
function mixAudioTracks(tracks) {
  const real = tracks.filter(Boolean);
  if (real.length === 0) return null;
  if (real.length === 1) return real[0];
  const ctx = new AudioContext();
  const dest = ctx.createMediaStreamDestination();
  real.forEach((track) => {
    ctx.createMediaStreamSource(new MediaStream([track])).connect(dest);
  });
  return dest.stream.getAudioTracks()[0];
}

// Twitch's WHIP endpoint only accepts H264 video, but Chrome's default codec
// preference order usually puts VP8/VP9 first — so we re-order the video
// transceiver's preferences to put H264 first before creating the offer.
function preferH264(peerConnection) {
  try {
    const transceiver = peerConnection.getTransceivers()
      .find((t) => t.sender.track && t.sender.track.kind === 'video');
    if (!transceiver || !transceiver.setCodecPreferences) return;
    const codecs = RTCRtpSender.getCapabilities('video').codecs;
    const h264 = codecs.filter((c) => c.mimeType === 'video/H264');
    if (h264.length) transceiver.setCodecPreferences(h264);
  } catch (err) {
    console.warn('Could not set H264 preference:', err);
  }
}

// WHIP is a "single-shot" offer/answer: the whole SDP, ICE candidates included,
// goes in one POST. So we wait for ICE gathering to finish before sending it.
function waitForIceGathering(peerConnection) {
  if (peerConnection.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    function check() {
      if (peerConnection.iceGatheringState === 'complete') {
        peerConnection.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    }
    peerConnection.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 4000); // safety net if gathering stalls
  });
}

async function shareScreen() {
  try {
    displayStream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 },
      audio: true,
    });
    els.preview.srcObject = displayStream;
    els.previewEmpty.style.display = 'none';
    els.shareBtn.disabled = true;
    els.goLiveBtn.disabled = false;
    els.stopBtn.disabled = false;
    setStatus('standby', 'Ready — add your stream key');

    // If the user stops sharing from Chrome's own "Stop sharing" bar, clean up.
    displayStream.getVideoTracks()[0].addEventListener('ended', stopStream);
  } catch (err) {
    setStatus('error', 'Screen share cancelled');
  }
}

async function goLive() {
  const key = els.streamKey.value.trim();
  if (!key) {
    setStatus('error', 'Add your stream key first');
    return;
  }

  els.goLiveBtn.disabled = true;
  setStatus('standby', 'Connecting to Twitch…');

  try {
    if (els.micToggle.checked) {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    const mixedAudio = mixAudioTracks([
      ...(micStream ? micStream.getAudioTracks() : []),
      ...displayStream.getAudioTracks(),
    ]);

    pc = new RTCPeerConnection();
    pc.addTrack(displayStream.getVideoTracks()[0], displayStream);
    if (mixedAudio) pc.addTrack(mixedAudio, displayStream);
    preferH264(pc); // must run before createOffer() so the SDP reflects it

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIceGathering(pc);

    const res = await fetch(WHIP_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/sdp',
        'Authorization': `Bearer ${key}`,
      },
      body: pc.localDescription.sdp,
    });

    if (!res.ok) throw new Error(`Twitch rejected the connection (HTTP ${res.status})`);

    whipResourceUrl = res.headers.get('Location');
    const answerSdp = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    setStatus('live', 'Live on Twitch');
  } catch (err) {
    console.error(err);
    setStatus('error', err.message || 'Could not connect to Twitch');
    els.goLiveBtn.disabled = false;
  }
}

async function stopStream() {
  clearInterval(timerInterval);
  if (whipResourceUrl) {
    try { await fetch(whipResourceUrl, { method: 'DELETE' }); } catch (err) { /* best effort */ }
  }
  if (pc) { pc.close(); pc = null; }
  [displayStream, micStream].forEach((s) => s && s.getTracks().forEach((t) => t.stop()));
  displayStream = null;
  micStream = null;
  whipResourceUrl = null;

  els.preview.srcObject = null;
  els.previewEmpty.style.display = '';
  els.shareBtn.disabled = false;
  els.goLiveBtn.disabled = true;
  els.stopBtn.disabled = true;
  els.timer.textContent = '00:00:00';
  setStatus('idle', 'Idle');
}

els.shareBtn.addEventListener('click', shareScreen);
els.goLiveBtn.addEventListener('click', goLive);
els.stopBtn.addEventListener('click', stopStream);
</script>
</body>
</html>
